name: PHP lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
